{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova Multidisciplinar</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff; text-align: center; position: relative;
            background-color: #026873; padding: 20px;
        }
        .fundo-imagem {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(2, 104, 115, 0.45), rgba(2, 104, 115, 0.45)),
                url('{% static "img/imagemfundo1.png" %}');
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        .btn-voltar {
            position: relative; z-index: 3; display: inline-block; margin-bottom: 15px;
            text-decoration: none; color: white; font-weight: bold;
            background: rgba(1,45,50,0.8); padding: 10px 18px; border-radius: 8px;
        }
        h1 { position: relative; z-index: 2; color: #ffd54f; font-size: 1.7em; margin: 10px 0 20px; }
        .area-jogo {
            position: relative; z-index: 2; max-width: 620px; margin: 0 auto;
            background: rgba(1, 45, 50, 0.6); border: 2px solid rgba(255,255,255,0.35);
            padding: 35px 25px; border-radius: 20px;
        }
        .tag-materia {
            display: inline-block; background: #f4b400; color: #2c1e00; font-weight: bold;
            font-size: 0.8em; padding: 5px 14px; border-radius: 20px; margin-bottom: 14px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .pergunta {
            font-size: 1.3em; line-height: 1.5; margin-bottom: 28px;
            background: rgba(255,255,255,0.08); padding: 18px; border-radius: 14px;
        }
        .icone-svg-caixa { width: 180px; height: 144px; margin: 0 auto; }
        .icone-svg-caixa svg { width: 100%; height: 100%; }
        .grade-opcoes { display: flex; flex-direction: column; gap: 14px; }
        .btn-opcao {
            background-color: #e8e8e0; color: #1c2b22; padding: 16px 14px;
            border-radius: 12px; font-size: 1.05em; font-weight: bold; cursor: pointer;
            border: 3px solid transparent; transition: all 0.2s; text-align: left;
        }
        .btn-opcao.correto { background-color: #6fdc8c; border-color: #27ae60; }
        .btn-opcao.errado { background-color: #ff8a80; border-color: #c0392b; animation: tremer 0.3s; }
        @keyframes tremer {
            0% { transform: translateX(0); } 25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } 100% { transform: translateX(0); }
        }
        .placar { position: relative; z-index: 2; margin-top: 18px; font-size: 1.1em; font-weight: bold; }
        .tela-fim { display: none; }
        .btn-novo-jogo {
            background: #f4b400; color: #2c1e00; padding: 14px 28px; font-size: 1.15em;
            border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold;
            text-decoration: none; display: inline-block;
        }
        @media (max-width: 500px) {
            .pergunta { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="fundo-imagem"></div>
    <a class="btn-voltar" href="{% url 'home' %}">⬅ Voltar</a>
    <h1>📝 Prova Multidisciplinar</h1>

    <div class="area-jogo" id="tela-quiz">
        <div class="tag-materia" id="tag-materia"></div>
        <div class="pergunta" id="pergunta-display"></div>
        <div class="grade-opcoes" id="opcoes-display"></div>
    </div>

    <div class="area-jogo tela-fim" id="tela-fim">
        <h2>🎉 Prova concluída!</h2>
        <p>Você acertou <strong id="resumo-acertos"></strong> de <span id="resumo-total"></span> questões.</p>
        <a class="btn-novo-jogo" href="{% url 'prova_config' %}">🔁 Montar Nova Prova</a>
    </div>

    <div class="placar">
        Questão <span id="contador-atual">1</span>/<span id="total-questoes"></span> —
        Erros: <span id="contador-erros">0</span>
    </div>

    <script>
        const questoesData = {{ questoes_json|safe }};
        let indiceAtual = 0;
        let erros = 0;
        let erroNestaQuestao = 0;
        let acertosPerfeitos = 0;
        const totalQuestoes = questoesData.length;
        let tempoInicioQuestao = Date.now();

        document.getElementById('total-questoes').innerText = totalQuestoes;
        document.getElementById('resumo-total').innerText = totalQuestoes;

        // Mesmos ícones SVG do quiz de Inglês — a Prova reaproveita as
        // mesmas perguntas de "Rooms in the House", então precisa saber
        // desenhar esses ícones também (sem isso, aparecia só a
        // palavra-chave em texto, tipo "chair", em vez do desenho).
        const iconesSVG = {
            table: `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="25" width="80" height="10" rx="2" fill="#8d6e63"/>
                <rect x="15" y="35" width="8" height="35" fill="#6d4c41"/>
                <rect x="77" y="35" width="8" height="35" fill="#6d4c41"/>
            </svg>`,
            stove: `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="15" y="10" width="70" height="60" rx="4" fill="#455a64"/>
                <circle cx="32" cy="22" r="7" fill="#263238"/>
                <circle cx="68" cy="22" r="7" fill="#263238"/>
                <rect x="25" y="38" width="50" height="26" rx="3" fill="#37474f"/>
                <circle cx="50" cy="51" r="8" fill="#607d8b"/>
            </svg>`,
            microwave: `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="18" width="80" height="44" rx="4" fill="#b0bec5"/>
                <rect x="16" y="24" width="48" height="32" rx="2" fill="#37474f"/>
                <rect x="70" y="26" width="12" height="6" fill="#78909c"/>
                <rect x="70" y="36" width="12" height="6" fill="#78909c"/>
                <rect x="70" y="46" width="12" height="6" fill="#ffb300"/>
            </svg>`,
            chair: `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="30" y="10" width="40" height="8" rx="2" fill="#8d6e63"/>
                <rect x="30" y="18" width="8" height="30" fill="#8d6e63"/>
                <rect x="62" y="18" width="8" height="30" fill="#8d6e63"/>
                <rect x="25" y="45" width="50" height="10" rx="2" fill="#a1887f"/>
                <rect x="30" y="55" width="6" height="20" fill="#6d4c41"/>
                <rect x="64" y="55" width="6" height="20" fill="#6d4c41"/>
            </svg>`,
            sofa: `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="35" width="80" height="30" rx="8" fill="#5c6bc0"/>
                <rect x="5" y="25" width="14" height="40" rx="6" fill="#3949ab"/>
                <rect x="81" y="25" width="14" height="40" rx="6" fill="#3949ab"/>
                <rect x="22" y="20" width="56" height="20" rx="6" fill="#7986cb"/>
            </svg>`,
            shelf: `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="30" width="80" height="8" rx="2" fill="#8d6e63"/>
                <rect x="18" y="14" width="8" height="16" fill="#e53935"/>
                <rect x="30" y="10" width="8" height="20" fill="#43a047"/>
                <rect x="42" y="16" width="8" height="14" fill="#1e88e5"/>
                <rect x="10" y="55" width="80" height="8" rx="2" fill="#8d6e63"/>
            </svg>`,
            fridge: `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="30" y="5" width="40" height="70" rx="5" fill="#eceff1"/>
                <rect x="30" y="26" width="40" height="3" fill="#b0bec5"/>
                <rect x="62" y="10" width="4" height="12" fill="#78909c"/>
                <rect x="62" y="32" width="4" height="16" fill="#78909c"/>
            </svg>`,
            washing_machine: `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="20" y="8" width="60" height="64" rx="5" fill="#cfd8dc"/>
                <rect x="26" y="14" width="48" height="10" rx="2" fill="#90a4ae"/>
                <circle cx="50" cy="48" r="18" fill="#455a64"/>
                <circle cx="50" cy="48" r="12" fill="#78909c"/>
            </svg>`,
        };

        function carregarQuestao() {
            if (indiceAtual >= totalQuestoes) { finalizarJogo(); return; }
            const atual = questoesData[indiceAtual];
            document.getElementById('tag-materia').innerText = atual.materia;

            const displayDiv = document.getElementById('pergunta-display');
            if (iconesSVG[atual.pergunta]) {
                displayDiv.innerHTML = '<div class="icone-svg-caixa">' + iconesSVG[atual.pergunta] + '</div>';
            } else {
                displayDiv.innerHTML = '<strong>' + atual.pergunta + '</strong>';
            }
            document.getElementById('contador-atual').innerText = indiceAtual + 1;

            const opcoesDiv = document.getElementById('opcoes-display');
            opcoesDiv.innerHTML = '';
            atual.opcoes.forEach(opcao => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcao';
                btn.innerText = opcao;
                btn.onclick = () => verificarResposta(btn, opcao, atual.resposta);
                opcoesDiv.appendChild(btn);
            });
            tempoInicioQuestao = Date.now();
        }

        function verificarResposta(botao, selecionada, correta) {
            if (selecionada === correta) {
                botao.classList.add('correto');
                document.querySelectorAll('.btn-opcao').forEach(b => b.disabled = true);
                if (erroNestaQuestao === 0) acertosPerfeitos++;
                salvarQuestao(erroNestaQuestao === 0);
                erroNestaQuestao = 0;
                setTimeout(() => { indiceAtual++; carregarQuestao(); }, 1100);
            } else {
                botao.classList.add('errado');
                setTimeout(() => botao.classList.remove('errado'), 400);
                erros++; erroNestaQuestao++;
                document.getElementById('contador-erros').innerText = erros;
            }
        }

        function salvarQuestao(acertouSemErro) {
            const tempo = (Date.now() - tempoInicioQuestao) / 1000;
            fetch("{% url 'salvar_jogada' %}", {
                method: 'POST',
                keepalive: true,
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    operacao: 'prova_multidisciplinar',
                    nivel: 'prova_questao',
                    resposta_aluno: String(indiceAtual),
                    acertou: acertouSemErro,
                    tempo_segundos: tempo
                })
            }).catch(err => console.error('Erro ao salvar jogada:', err));
        }

        function finalizarJogo() {
            document.getElementById('tela-quiz').style.display = 'none';
            document.getElementById('tela-fim').style.display = 'block';
            document.getElementById('resumo-acertos').innerText = acertosPerfeitos;
        }

        carregarQuestao();
    </script>
</body>
</html>
