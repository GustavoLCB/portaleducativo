{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ nome_tema }} Hive</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff; text-align: center; position: relative;
            background-color: #0d3b66; padding: 20px;
        }
        .fundo-imagem {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(13, 59, 102, 0.5), rgba(13, 59, 102, 0.5)),
                url('{% static "img/fundoing.png" %}');
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        .btn-voltar {
            position: relative; z-index: 3; display: inline-block; margin-bottom: 12px;
            text-decoration: none; color: white; font-weight: bold;
            background: rgba(6,30,54,0.8); padding: 10px 18px; border-radius: 8px;
        }
        h1 { position: relative; z-index: 2; color: #ffd54f; font-size: 1.7em; margin: 6px 0 6px; }
        p.instrucao {
            position: relative; z-index: 2; margin: 0 0 22px; font-size: 1em; color: #e8e8e0;
        }
        .area-jogo {
            position: relative; z-index: 2; max-width: 800px; margin: 0 auto;
            background: rgba(6, 30, 54, 0.55); border: 2px solid rgba(255,255,255,0.35);
            padding: 30px 20px; border-radius: 20px;
        }
        .colmeia-grade {
            display: flex; flex-wrap: wrap; justify-content: center;
        }
        .hex {
            position: relative;
            width: 128px; height: 112px; margin: 7px;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            background-color: #f2f0e6; color: #0d2035;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer;
            transition: transform 0.15s, background-color 0.3s; user-select: none;
            padding: 6px;
        }
        .hex.hex-emoji { font-size: 3.2em; }
        .hex.hex-texto { font-size: 0.82em; line-height: 1.2; }
        .hex:hover { transform: scale(1.06); }
        .hex.selecionada { box-shadow: inset 0 0 0 5px #ffd54f; }
        .hex.combinada { cursor: default; }
        .hex.combinada:hover { transform: none; }
        .hex.errada { animation: tremer 0.35s; }
        @keyframes tremer {
            0% { transform: translateX(0); } 25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); } 75% { transform: translateX(-6px); } 100% { transform: translateX(0); }
        }
        .placar {
            position: relative; z-index: 2; margin-top: 18px; font-size: 1.1em; font-weight: bold;
        }
        .tela-fim { display: none; }
        .btn-novo-jogo {
            background: #f4b400; color: #2c1e00; padding: 14px 28px; font-size: 1.2em;
            border: none; border-radius: 10px; cursor: pointer; margin-top: 18px; font-weight: bold;
        }
        @media (max-width: 480px) {
            .hex { width: 100px; height: 88px; margin: 5px; }
            .hex.hex-emoji { font-size: 2.4em; }
            .hex.hex-texto { font-size: 0.72em; }
        }
    </style>
</head>
<body>
    <div class="fundo-imagem"></div>
    <a class="btn-voltar" href="{% url 'menu_ingles_science' %}">⬅ Voltar</a>
    <h1>{{ icone_tema }} {{ nome_tema }} Hive</h1>
    <p class="instrucao">Tap an animal, then tap its matching label. Get it right and both turn the same color!</p>

    <div class="area-jogo" id="tela-jogo">
        <div class="colmeia-grade" id="colmeia-grade"></div>
    </div>

    <div class="area-jogo tela-fim" id="tela-fim">
        <h2>🎉 Hive complete!</h2>
        <p>You matched <strong id="resumo-acertos"></strong> of <span id="resumo-total"></span> pairs, with <span id="resumo-erros"></span> mistake(s).</p>
        <button class="btn-novo-jogo" onclick="location.reload()">Play Again</button>
    </div>

    <div class="placar" id="placar">
        Pairs found: <span id="contador-pares">0</span>/<span id="total-pares"></span> —
        Mistakes: <span id="contador-erros">0</span>
    </div>

    <script>
        const tema = "{{ tema }}";
        const paresData = {{ pares_json|safe }};
        const totalPares = paresData.length;

        // Paleta de cores vivas para os pares acertados (não repete dentro da mesma partida).
        const paletaCores = [
            '#ff6b6b', '#4ecdc4', '#ffd93d', '#95e06c', '#a685e2',
            '#ff9f68', '#54a0ff', '#f78fb3', '#00d2a0', '#e77f67',
        ];

        document.getElementById('total-pares').innerText = totalPares;
        document.getElementById('resumo-total').innerText = totalPares;

        let paresEncontrados = 0;
        let erros = 0;
        let celulaSelecionada = null; // { elemento, tipo: 'esquerda'|'direita', parId }
        let tempoInicioPar = Date.now();

        // Monta as 2*N células (esquerda = emoji, direita = rótulo) e embaralha.
        let celulas = [];
        paresData.forEach((par, idx) => {
            celulas.push({ tipo: 'esquerda', parId: idx, label: par.esquerda, classe: 'hex-emoji' });
            celulas.push({ tipo: 'direita', parId: idx, label: par.direita, classe: 'hex-texto' });
        });
        for (let i = celulas.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [celulas[i], celulas[j]] = [celulas[j], celulas[i]];
        }

        const grade = document.getElementById('colmeia-grade');
        celulas.forEach((cel, i) => {
            const div = document.createElement('div');
            div.className = 'hex ' + cel.classe;
            div.innerText = cel.label;
            div.dataset.index = i;
            div.addEventListener('click', () => aoClicar(div, cel));
            grade.appendChild(div);
        });

        function aoClicar(elemento, cel) {
            if (elemento.classList.contains('combinada')) return;

            if (!celulaSelecionada) {
                elemento.classList.add('selecionada');
                celulaSelecionada = { elemento, ...cel };
                tempoInicioPar = Date.now();
                return;
            }

            if (celulaSelecionada.elemento === elemento) {
                elemento.classList.remove('selecionada');
                celulaSelecionada = null;
                return;
            }

            if (celulaSelecionada.tipo === cel.tipo) {
                celulaSelecionada.elemento.classList.remove('selecionada');
                elemento.classList.add('selecionada');
                celulaSelecionada = { elemento, ...cel };
                return;
            }

            const acertou = celulaSelecionada.parId === cel.parId;
            const tempo = (Date.now() - tempoInicioPar) / 1000;

            if (acertou) {
                const cor = paletaCores[paresEncontrados % paletaCores.length];
                elemento.style.backgroundColor = cor;
                celulaSelecionada.elemento.style.backgroundColor = cor;
                elemento.style.color = '#0d2035';
                celulaSelecionada.elemento.style.color = '#0d2035';
                elemento.classList.add('combinada');
                celulaSelecionada.elemento.classList.add('combinada');
                elemento.classList.remove('selecionada');
                celulaSelecionada.elemento.classList.remove('selecionada');

                paresEncontrados++;
                document.getElementById('contador-pares').innerText = paresEncontrados;
                salvarPar(true, tempo);

                if (paresEncontrados >= totalPares) {
                    setTimeout(finalizarJogo, 700);
                }
            } else {
                [elemento, celulaSelecionada.elemento].forEach(el => {
                    el.classList.add('errada');
                    setTimeout(() => el.classList.remove('errada'), 400);
                });
                erros++;
                document.getElementById('contador-erros').innerText = erros;
                salvarPar(false, tempo);
            }

            celulaSelecionada.elemento.classList.remove('selecionada');
            celulaSelecionada = null;
        }

        function salvarPar(acertou, tempo) {
            fetch("{% url 'salvar_jogada' %}", {
                method: 'POST',
                keepalive: true,
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    operacao: 'ingles_science_hive_' + tema,
                    nivel: 'science_hive_par',
                    resposta_aluno: String(paresEncontrados),
                    acertou: acertou,
                    tempo_segundos: tempo
                })
            }).catch(err => console.error('Erro ao salvar jogada:', err));
        }

        function finalizarJogo() {
            document.getElementById('tela-jogo').style.display = 'none';
            document.getElementById('placar').style.display = 'none';
            document.getElementById('tela-fim').style.display = 'block';
            document.getElementById('resumo-acertos').innerText = paresEncontrados;
            document.getElementById('resumo-erros').innerText = erros;
        }
    </script>
</body>
</html>
